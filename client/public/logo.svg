<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e102a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <!-- Neon Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Neon Pink Glow Gradient -->
    <linearGradient id="pinkNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" filter="url(#shadowFilter)"/>
  
  <!-- Subtle Inner Glass Ring -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Top Ambient Glow -->
  <circle cx="256" cy="130" r="80" fill="#ec4899" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- ================= ROYAL CROWN ================= -->
  <g id="crown" filter="url(#shadowFilter)">
    <!-- Crown Base -->
    <path d="M 180 185 L 332 185 L 322 170 L 190 170 Z" fill="url(#goldGrad)" stroke="#fbbf24" stroke-width="2"/>
    <!-- Jewels on Base -->
    <circle cx="210" cy="177" r="4" fill="#ec4899"/>
    <circle cx="256" cy="177" r="5" fill="#38bdf8"/>
    <circle cx="302" cy="177" r="4" fill="#ec4899"/>

    <!-- Crown Peaks -->
    <path d="M 185 170 
             L 165 110 L 210 142 
             L 256 85 
             L 302 142 L 347 110 
             L 327 170 Z" 
          fill="url(#goldGrad)" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>

    <!-- Crown Pearls/Gems on Peaks -->
    <circle cx="165" cy="108" r="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="210" cy="140" r="5" fill="#ec4899"/>
    <circle cx="256" cy="83" r="8" fill="#fff" stroke="#f59e0b" stroke-width="2" filter="url(#neonGlow)"/>
    <circle cx="302" cy="140" r="5" fill="#ec4899"/>
    <circle cx="347" cy="108" r="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- ================= CROSSED BARBER SCISSORS ================= -->
  <!-- Left Blade to Right Handle -->
  <g id="scissorBlade1">
    <!-- Blade -->
    <path d="M 130 140 L 256 266 L 246 276 L 120 150 Z" fill="url(#goldGrad)"/>
    <path d="M 130 140 L 256 266" stroke="#f472b6" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>
    <!-- Pivot Screw -->
    <circle cx="256" cy="266" r="10" fill="url(#goldGrad)" stroke="#fff" stroke-width="2"/>
    <!-- Bottom Handle Shank & Finger Ring -->
    <path d="M 256 266 L 310 320" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="350" cy="360" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <circle cx="350" cy="360" r="28" fill="none" stroke="#ec4899" stroke-width="3" filter="url(#neonGlow)"/>
    <!-- Scissor Finger Rest (Tang) -->
    <path d="M 378 385 C 395 405 405 410 415 412" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Right Blade to Left Handle -->
  <g id="scissorBlade2">
    <!-- Blade -->
    <path d="M 382 140 L 256 266 L 266 276 L 392 150 Z" fill="url(#goldGrad)"/>
    <path d="M 382 140 L 256 266" stroke="#f472b6" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>
    <!-- Bottom Handle Shank & Finger Ring -->
    <path d="M 256 266 L 202 320" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="162" cy="360" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <circle cx="162" cy="360" r="28" fill="none" stroke="#ec4899" stroke-width="3" filter="url(#neonGlow)"/>
  </g>

  <!-- ================= GLOWING LETTER 'Q' ================= -->
  <g id="letterQ" filter="url(#neonGlow)">
    <!-- Circular Ring of Q -->
    <circle cx="256" cy="340" r="54" fill="none" stroke="url(#pinkNeon)" stroke-width="14"/>
    <circle cx="256" cy="340" r="54" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    <!-- Signature Tail of Q -->
    <path d="M 275 360 C 295 385 320 405 340 400" fill="none" stroke="url(#pinkNeon)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 275 360 C 295 385 320 405 340 400" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Subtle Polish Shimmer Star -->
  <g transform="translate(130, 140)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#ffffff" filter="url(#neonGlow)"/>
  </g>
  <g transform="translate(382, 140)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#ffffff" filter="url(#neonGlow)"/>
  </g>
</svg>
